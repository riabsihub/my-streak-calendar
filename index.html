<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f4">
  <meta name="description" content="A simple personal yearly streak calendar.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>My Streak Calendar</title>
  <style>
    :root { color-scheme: light; --bg:#f7f7f4; --card:#fff; --ink:#22251f; --muted:#74796f; --line:#e7e8e1; --done:#d5ead8; --done-ink:#205c34; --today:#e8edf9; --today-line:#647bb5; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { max-width:980px; margin:0 auto; padding: max(24px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom)); }
    header { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:20px; }
    h1 { font-size:clamp(1.55rem,4vw,2.2rem); letter-spacing:-.04em; margin:0 0 6px; }
    .sub { color:var(--muted); margin:0; font-size:.95rem; }
    .year-control { display:flex; align-items:center; gap:8px; }
    button { font:inherit; cursor:pointer; }
    .nav { border:1px solid var(--line); background:var(--card); border-radius:12px; width:40px; height:40px; font-size:1.25rem; }
    #yearLabel { font-weight:700; font-size:1.1rem; min-width:48px; text-align:center; }
    .summary { display:flex; align-items:center; gap:20px; flex-wrap:wrap; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px 18px; margin-bottom:20px; }
    .stat strong { display:block; font-size:1.4rem; letter-spacing:-.03em; }
    .stat span { color:var(--muted); font-size:.8rem; }
    .legend { margin-left:auto; color:var(--muted); font-size:.8rem; display:flex; align-items:center; gap:7px; }
    .legend-dot { width:13px; height:13px; border-radius:4px; background:var(--done); border:1px solid #c4dfc9; }
    .year-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
    .month { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 12px 12px; min-width:0; }
    .month h2 { margin:0 0 12px; font-size:.96rem; font-weight:700; }
    .weekdays,.days { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; }
    .weekday { text-align:center; font-size:.66rem; color:var(--muted); padding-bottom:3px; }
    .day { min-width:0; aspect-ratio:1; padding:0; border:1px solid transparent; border-radius:7px; background:transparent; color:var(--ink); font-size:clamp(.65rem,1.6vw,.82rem); display:flex; align-items:center; justify-content:center; position:relative; }
    .day:disabled { cursor:default; color:#b8bbb3; }
    .day.done { background:var(--done); color:var(--done-ink); font-weight:700; }
    .day.done::after { content:"✓"; font-size:.68em; position:absolute; right:1px; top:-2px; }
    .day.today { border-color:var(--today-line); background:var(--today); }
    .day.today.done { background:var(--done); border-color:var(--today-line); }
    .day:focus-visible,.nav:focus-visible,.action:focus-visible { outline:3px solid #647bb5; outline-offset:2px; }
    .footer { margin-top:18px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; color:var(--muted); font-size:.8rem; }
    .action { border:1px solid var(--line); background:var(--card); border-radius:10px; padding:9px 12px; color:var(--ink); }
    #notice { min-height:1.2em; color:var(--muted); }
    @media (max-width:700px) { .year-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; } .month { padding:12px 8px 9px; } .weekdays,.days { gap:2px; } .day { border-radius:5px; } .summary { gap:14px; } .legend { margin-left:0; width:100%; } }
    @media (max-width:390px) { main { padding-left:10px; padding-right:10px; } .year-grid { gap:7px; } .month { padding-left:6px; padding-right:6px; } .day { font-size:.62rem; } }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>My Streak Calendar</h1>
      <p class="sub">One small check-in a day.</p>
    </div>
    <div class="year-control" aria-label="Choose year">
      <button class="nav" id="prevYear" aria-label="Previous year">‹</button>
      <span id="yearLabel"></span>
      <button class="nav" id="nextYear" aria-label="Next year">›</button>
    </div>
  </header>
  <section class="summary" aria-label="Progress summary">
    <div class="stat"><strong id="totalDone">0</strong><span>days checked this year</span></div>
    <div class="stat"><strong id="currentStreak">0</strong><span>day current streak</span></div>
    <div class="legend"><span class="legend-dot"></span> Completed day</div>
  </section>
  <section id="calendar" class="year-grid" aria-label="Yearly calendar"></section>
  <div class="footer">
    <span>Tap any date to check or uncheck it.</span>
    <button class="action" id="exportBtn">Export backup</button>
    <button class="action" id="importBtn">Import backup</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
  <p id="notice" role="status" aria-live="polite"></p>
</main>
<script>
(() => {
  const STORAGE_KEY = "personal-streak-calendar-v1";
  const today = new Date();
  let shownYear = today.getFullYear();
  let checked = load();
  const calendar = document.getElementById("calendar");
  const yearLabel = document.getElementById("yearLabel");
  const totalDone = document.getElementById("totalDone");
  const currentStreak = document.getElementById("currentStreak");
  const notice = document.getElementById("notice");
  const weekdays = ["M","T","W","T","F","S","S"];
  const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      return new Set(Array.isArray(data) ? data.filter(x => typeof x === "string") : []);
    } catch { return new Set(); }
  }
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...checked]));
      notice.textContent = "Saved on this device.";
    } catch {
      notice.textContent = "Could not save in this browser. Export a backup to keep your records.";
    }
  }
  function key(y,m,d) {
    return `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  }
  function mondayFirstDay(y,m) {
    return (new Date(y,m,1).getDay() + 6) % 7;
  }
  function countYear(y) {
    return [...checked].filter(k => k.startsWith(`${y}-`)).length;
  }
  function calculateStreak() {
    const cursor = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    let k = key(cursor.getFullYear(), cursor.getMonth(), cursor.getDate());
    if (!checked.has(k)) cursor.setDate(cursor.getDate()-1);
    let count = 0;
    while (checked.has(key(cursor.getFullYear(), cursor.getMonth(), cursor.getDate()))) {
      count++;
      cursor.setDate(cursor.getDate()-1);
    }
    return count;
  }
  function render() {
    yearLabel.textContent = shownYear;
    totalDone.textContent = countYear(shownYear);
    currentStreak.textContent = calculateStreak();
    calendar.replaceChildren();
    for (let m=0; m<12; m++) {
      const card = document.createElement("article");
      card.className = "month";
      const title = document.createElement("h2");
      title.textContent = monthNames[m];
      card.appendChild(title);
      const weekRow = document.createElement("div");
      weekRow.className = "weekdays";
      weekdays.forEach(w => {
        const el = document.createElement("span");
        el.className = "weekday";
        el.textContent = w;
        weekRow.appendChild(el);
      });
      card.appendChild(weekRow);
      const days = document.createElement("div");
      days.className = "days";
      for (let blank=0; blank<mondayFirstDay(shownYear,m); blank++) {
        const spacer = document.createElement("span");
        spacer.setAttribute("aria-hidden","true");
        days.appendChild(spacer);
      }
      const numDays = new Date(shownYear,m+1,0).getDate();
      for (let d=1; d<=numDays; d++) {
        const dateKey = key(shownYear,m,d);
        const btn = document.createElement("button");
        btn.className = "day";
        btn.textContent = d;
        btn.setAttribute("aria-label", `${monthNames[m]} ${d}, ${shownYear}${checked.has(dateKey) ? ", completed" : ", not completed"}`);
        btn.setAttribute("aria-pressed", checked.has(dateKey) ? "true" : "false");
        const isToday = shownYear===today.getFullYear() && m===today.getMonth() && d===today.getDate();
        if (isToday) btn.classList.add("today");
        if (checked.has(dateKey)) btn.classList.add("done");
        const dateObj = new Date(shownYear,m,d);
        if (dateObj > new Date(today.getFullYear(),today.getMonth(),today.getDate())) {
          btn.disabled = true;
          btn.title = "Future date";
        } else {
          btn.addEventListener("click", () => {
            if (checked.has(dateKey)) checked.delete(dateKey);
            else checked.add(dateKey);
            save();
            render();
          });
        }
        days.appendChild(btn);
      }
      card.appendChild(days);
      calendar.appendChild(card);
    }
  }
  document.getElementById("prevYear").addEventListener("click", () => { shownYear--; render(); });
  document.getElementById("nextYear").addEventListener("click", () => { if (shownYear < today.getFullYear()) { shownYear++; render(); } });
  document.getElementById("exportBtn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify({app:"personal-streak-calendar",version:1,checked:[...checked]},null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url; a.download="streak-calendar-backup.json"; a.click();
    URL.revokeObjectURL(url); notice.textContent = "Backup exported.";
  });
  document.getElementById("importBtn").addEventListener("click", () => document.getElementById("importFile").click());
  document.getElementById("importFile").addEventListener("change", async e => {
    const file=e.target.files[0]; if (!file) return;
    try {
      const data=JSON.parse(await file.text());
      const values=Array.isArray(data) ? data : data.checked;
      if (!Array.isArray(values) || !values.every(x => typeof x==="string" && /^\d{4}-\d{2}-\d{2}$/.test(x))) throw new Error("Invalid backup");
      if (confirm("Importing will replace the checkmarks currently saved in this browser. Continue?")) {
        checked=new Set(values); save(); render(); notice.textContent="Backup imported.";
      }
    } catch { notice.textContent="That file doesn't look like a valid streak calendar backup."; }
    e.target.value="";
  });
  render();
  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js").catch(() => {}));
})();
</script>
</body>
</html>
